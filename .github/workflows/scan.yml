name: Scan jobs once
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scan.js
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
